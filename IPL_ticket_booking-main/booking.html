
<!DOCTYPE html>
<html>
<head>
    <title>IPL Ticket Booking</title>
</head>
<body>

    <h1>IPL Ticket Booking Form</h1>

    <form>

        <label>Name:</label>
        <input type="text" required minlength="2" maxlength="30">
        <br><br>

        <label>Email:</label>
        <input type="email" required>
        <br><br>

        <label>Phone Number:</label>
        <input type="tel" pattern="[0-9]{10}" required>
        <br><br>

        <label>Select Match:</label>
        <select required>
            <option value="">Choose Match</option>
            <option>RCB vs CSK</option>
            <option>MI vs RCB</option>
            <option>CSK vs MI</option>
        </select>
        <br><br>

        <label>Stand Category:</label>
        <select required>
            <option value="">Choose Stand</option>
            <option>General</option>
            <option>Premium</option>
            <option>VIP</option>
        </select>
        <br><br>

        <label>Number of Tickets:</label>
        <input type="number" min="1" max="10" required>
        <br><br>

        <label>Booking Preference:</label><br>
        <input type="radio" name="preference" value="Online"> Online
        <input type="radio" name="preference" value="Counter"> Counter
        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
